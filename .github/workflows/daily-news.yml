# Every morning at 9:00 Madrid time, pushes an empty "daily news refresh" commit to main.
# Vercel deploys every push to main, and the build fetches the latest headlines, so /news/
# always shows the news from 00:00 yesterday to 9:00 today. No tokens or secrets needed:
# the workflow uses GitHub's own GITHUB_TOKEN to push.
name: Daily markets news

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules run in UTC, which has no summer time. One of these is 9:00 in Madrid
    # depending on the season; the gate below lets only that one through.
    - cron: "0 7 * * *" # 9:00 Madrid in summer (UTC+2)
    - cron: "0 8 * * *" # 9:00 Madrid in winter (UTC+1)

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Is it 9:00 in Madrid?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          run=true
          if [ "$EVENT" = "schedule" ]; then
            # Decide by the cron that fired, not the clock, so a late start still counts.
            offset=$(TZ=Europe/Madrid date +%z)
            if [ "$offset" = "+0200" ] && [ "$CRON" != "0 7 * * *" ]; then run=false; fi
            if [ "$offset" = "+0100" ] && [ "$CRON" != "0 8 * * *" ]; then run=false; fi
          fi
          echo "Madrid offset: $(TZ=Europe/Madrid date +%z), cron: ${CRON:-none}, run: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          ref: main

      - name: Push the daily refresh commit (Vercel redeploys)
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Daily news refresh $(TZ=Europe/Madrid date +%Y-%m-%d)"
          git push origin HEAD:main
