# Every morning at 9:00 Madrid time, asks Vercel to rebuild FinanceGo so /news/ has the
# headlines from 00:00 yesterday to 9:00 today (the site is static: news is fetched at build).
# Vercel also rebuilds on every push to main through its GitHub integration.
#
# Setup (once): in Vercel → Project → Settings → Git → Deploy Hooks, create a hook for the
# main branch and save its URL in GitHub → Settings → Secrets and variables → Actions as
# VERCEL_DEPLOY_HOOK.
name: Daily markets news

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules run in UTC, which has no summer time. One of these is 9:00 in Madrid
    # depending on the season; the gate below lets only that one through.
    - cron: "0 7 * * *" # 9:00 Madrid in summer (UTC+2)
    - cron: "0 8 * * *" # 9:00 Madrid in winter (UTC+1)

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Is it 9:00 in Madrid?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          run=true
          if [ "$EVENT" = "schedule" ]; then
            # Decide by the cron that fired, not the clock, so a late start still counts.
            offset=$(TZ=Europe/Madrid date +%z)
            if [ "$offset" = "+0200" ] && [ "$CRON" != "0 7 * * *" ]; then run=false; fi
            if [ "$offset" = "+0100" ] && [ "$CRON" != "0 8 * * *" ]; then run=false; fi
          fi
          echo "Madrid offset: $(TZ=Europe/Madrid date +%z), cron: ${CRON:-none}, run: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Trigger the Vercel rebuild
        if: steps.gate.outputs.run == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Add the VERCEL_DEPLOY_HOOK secret (see the comment at the top of this file)."
            exit 1
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Rebuild requested."
